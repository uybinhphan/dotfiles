name: Shell lint

on:
  push:
  pull_request:

jobs:
  lint:
    name: ShellCheck + zsh -n
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh

      # Pick the linter from the file itself: zsh files only get a syntax check
      # (ShellCheck does not support zsh), bash/sh scripts get ShellCheck.
      - name: Lint every tracked shell file
        run: |
          rc=0
          while IFS= read -r f; do
            first=$(head -1 "$f")
            case "$f:$first" in
              *.zsh:*|.zshrc:*|*:'#!'*zsh*)
                zsh -n "$f" || rc=1 ;;
              *:'#!'*bash*|*:'#!'*/sh)
                shellcheck --severity=warning "$f" || rc=1 ;;
            esac
          done < <(git ls-files)
          exit $rc
